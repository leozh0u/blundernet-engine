name: train

on:
  schedule:
    # 2 slots/day (UTC): morning always trains, afternoon joins ~half of days
    - cron: "23 2 * * *"
    - cron: "41 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Build C++ MCTS core
        run: python cpp/setup.py build_ext --inplace

      - name: Restore latest checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p checkpoint
          gh release download model-latest --pattern model.pt --dir checkpoint || echo "no checkpoint yet, cold start"

      - name: Configure git author
        run: |
          git config user.name "Leo Zhou"
          git config user.email "zhouleo2007@gmail.com"

      - name: Run training pipeline
        run: |
          # Each day draws its own commit target T in [3,10], seeded by the
          # date so both runs agree on the plan. Training volume is the same
          # every run regardless (2-3 full batches); T only controls how the
          # work is grouped into commits. High-T days (>=9) also run the
          # benchmark suite, whose commits are part of the budget.
          # The pipeline is load-bearing; the benchmarks are best-effort and
          # warn instead of failing the run.
          seed=$(date -u +%Y%m%d)
          T=$(( (seed * 1103515245 + 12345) / 65536 % 8 + 3 ))
          A=$(( T / 3 ))                      # afternoon's share (0-3)
          M=$(( T - A ))                      # morning's share
          echo "daily commit target T=$T (morning $M, afternoon $A)"
          if [ "$(date -u +%H)" -lt 6 ]; then
            if [ "$T" -ge 9 ]; then
              B=$(( M - 4 )); [ "$B" -lt 1 ] && B=1
              python scripts/pipeline.py --commits "$B" --chart
              sudo apt-get install -y -q stockfish || echo "::warning::stockfish install failed; skipping anchor benchmark"
              python scripts/gauntlet.py --games 12 --sims 64 --commit \
                || echo "::warning::gauntlet failed this run"
              if command -v stockfish >/dev/null; then
                python scripts/stockfish_bench.py --games 8 --sims 128 --levels 0 1 3 --commit \
                  || echo "::warning::stockfish benchmark failed this run"
              fi
              python scripts/selfplay.py --games 2 --sims 96 --commit \
                || echo "::warning::selfplay failed this run"
            else
              python scripts/pipeline.py --commits "$M"
            fi
          else
            if [ "$A" -lt 1 ]; then
              echo "afternoon run sitting this day out (daily target already met)"
            else
              python scripts/pipeline.py --commits "$A"
            fi
          fi

      - name: Push commits
        run: bash scripts/ci_push.sh

      - name: Publish checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci_release.sh

      - name: Raise data-starvation alarm
        run: |
          if [ -f .starvation_alarm ]; then
            echo "::error::ingest has produced no games for $(cat .starvation_alarm) — the data source is likely broken"
            exit 1
          fi
