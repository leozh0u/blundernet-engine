name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "metrics/**"
      - "data/state.json"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Build C++ search core
        run: python cpp/setup.py build_ext --inplace

      - name: Run tests
        run: pytest -q
